    standard: CAS
    report: 2026 年第一季度报告（11 页，未经审计）
    format: 文本 PDF（A 股季报）
    disclosure_scope: 三大报表 + 主要会计数据 + 非经常性损益表；无权益变动表/附注
    source_file: docs/knowledge-base/02_research/original/p5_samples/yto_600233/YTO_2026_Q1_report.pdf
    sha256: e2be85539077783fdb0392dfe00626b76c7231e1370361d3b1fd6fc14c019039
    unit: 报表单位：人民币元；主要会计数据单位：人民币万元（两种单位并存，契约缩放必须正确）
    key_items:
      - { item: 营业收入, value: "18,768,681,556.28", location: "合并利润表 p7「营业收入」行（主要会计数据 p1：1,876,868.16 万元）", unit: 元 }
