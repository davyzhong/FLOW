# 财务报告验收数据集登记（A03）
# 依据：D049、客观财务分析主计划 M0/A03、方向规格第 3-4 节。
# 规则：参考答案由人工（本记录签署人）直接阅读披露原文独立录入，逐项给出页/表/行定位；
# 禁止调用被测抽取器（p5_extract_*.py / seed_statement_reports.py）生成或核对本文件中的 expected 值。

dataset_id: flow.validation.financial_reports.v1
created: 2026-09-06
owner: FLOW 项目（签署：Kimi，独立录入）
method: >
  独立录入流程——逐份打开原文 PDF，定位「主要会计数据」页与三大/四大报表，手工抄录关键项目，
  记录页码（PDF 页序 + 印刷页码）、表名、行名与原始单位；容差在 D03 执行前冻结；
  基线样本的独立答案与已验证锚点（P5-validation-summary §3）来源一致但由本流程重新抄录。

tolerance:
  statement_line_items: exact（报表行项目必须逐分逐文一致，容差为 0）
  summary_percentages: ±0.5 个披露末位（主要会计数据的百分比，披露方四舍五入）
  derived_ratios: ±0.1 个百分点（由披露值计算的比率，除非披露方另有说明）

