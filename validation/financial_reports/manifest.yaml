rules:
  - 任何 expected 值不得以被测抽取器的输出回填；发现回填即整份清单作废重录。
  - 留出样本首跑结果（含失败）全量保留于 docs/implementation/objective-analysis/holdout-results.md。
  - 覆盖率分母 = 本清单全部 key_items 与全部报表行项目，不得只报告通过的锚点。
  - 新增适配支持后，须同步登记新的留出候选，保持「未适配样本」池非空。
