name: FLOW CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://flow:flow_dev_only@localhost:5432/flow
  REDIS_URL: redis://localhost:6379/0
  S3_ENDPOINT_URL: http://localhost:9000
  S3_BUCKET: flow
  S3_ACCESS_KEY: flow
  S3_SECRET_KEY: flow_dev_only

jobs:
  static-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: cd services/api && uv run ruff check src tests && uv run mypy src

  static-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint && pnpm -r typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: >-
          cd services/api && uv run pytest
          tests/domain tests/api tests/test_health.py
          --ignore=tests/api/test_intake.py
          --ignore=tests/api/test_dashboard.py
          --ignore=tests/api/test_investigations.py
          --ignore=tests/api/test_copilot.py -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make infra-up
      - run: cd services/api && uv run alembic upgrade head
      - run: >-
          cd services/api && uv run pytest tests/integration tests/investigation tests/copilot
          tests/api/test_dashboard.py tests/api/test_investigations.py tests/api/test_copilot.py -q

  data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make test-data-contract

  intake-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make test-intake-e2e

  metrics-known-answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make test-metrics-known-answers

  analysis-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make test-analysis-invariants

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-dashboard
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dashboard-playwright-report
          path: playwright-report/
          retention-days: 14

  investigation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-investigation-e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: investigation-playwright-report
          path: playwright-report/
          retention-days: 14

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make contracts-check

  copilot-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make infra-up
      - run: cd services/api && uv run alembic upgrade head
      - run: make test-copilot-evals

  publishing-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-publishing-golden

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: docker compose -f infra/compose.yaml up -d --wait --wait-timeout 120 postgres
      - run: uv run scripts/wait_for_services.py localhost:5432
      - run: cd services/api && uv run python ../../scripts/check_migrations.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make stack-up
      - run: curl --fail http://localhost:8000/api/v1/health
      - run: curl --fail http://localhost:3000/
      - run: docker compose -f infra/compose.yaml exec -T worker celery -A flow_api.worker:celery_app inspect ping

  user-closure-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@10.17.1 install --frozen-lockfile
      - run: cd services/api && uv sync --all-groups --frozen
      - run: npx --yes pnpm@10.17.1 --filter @flow/web exec playwright install --with-deps chromium
      - run: bash scripts/test_user_closure_e2e.sh
      - if: failure()
        run: find apps/web/test-results -name "*.md" -exec cat {} \; 2>/dev/null || true
