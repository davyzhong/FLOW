name: FLOW CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://flow:flow_dev_only@localhost:5432/flow
  REDIS_URL: redis://localhost:6379/0
  S3_ENDPOINT_URL: http://localhost:9000
  S3_BUCKET: flow
  S3_ACCESS_KEY: flow
  S3_SECRET_KEY: flow_dev_only

jobs:
  static-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # M0 基线校验需要完整 git 历史回放 checkpoint
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: cd services/api && uv run ruff check src tests && uv run mypy src
      - run: cd services/api && uv run python -m unittest discover -s ../../scripts/tests -t ../.. -v
      - run: cd services/api && uv run pytest ../../scripts/tests/test_verify_workflow_jobs.py -q
      - run: python3 scripts/check_docs.py --phase m6

  static-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint && pnpm -r typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep this job independent of PostgreSQL, including on developer machines.
      DATABASE_URL: postgresql+psycopg://flow:flow_dev_only@127.0.0.1:1/flow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: >-
          cd services/api && uv run pytest
          tests/domain tests/api/test_auth_boundary.py
          tests/api/test_workspace.py tests/test_health.py
          tests/security/test_authorization.py -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make infra-up
      - run: cd services/api && uv run alembic upgrade head
      - run: >-
          cd services/api && uv run pytest tests/integration tests/investigation tests/copilot
          tests/api -q
          --ignore=tests/api/test_auth_boundary.py
          --ignore=tests/api/test_workspace.py
      # T11-G2 性能回归门禁（用户批准）：10× 合成规模下三类读路径 P95 ≤ 50ms
      # （本地基线 6.23/0.97/1.11ms 的 8-50 倍余量，只拦数量级劣化；CI 硬件差异见
      # docs/60_delivery/2026-09-15-cainiao-stress-test-report.md）
      - name: perf gate (10x scale)
        run: >-
          cd services/api &&
          bash ../../scripts/seed_p5_statements.sh > /dev/null &&
          uv run python ../../scripts/perf_baseline.py --scale 10 --max-p95 50

  # 每个 shard 独占 runner/数据库；保留全量测试，避免大麦真实 seed 在单个 job 串行堆积。
  data-contract-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard:
          - contracts
          - canonical-statements
          - generator-source
          - profile-known-workflow
          - loader-atomicity-edges
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make infra-up
      - name: 校验分片映射
        run: python3 scripts/data_contract_shards.py --verify
      - name: 运行当前分片
        env:
          DATA_CONTRACT_SHARD: ${{ matrix.shard }}
        run: python3 scripts/data_contract_shards.py --run-shard "$DATA_CONTRACT_SHARD"

  # 保留稳定的 required check 名称；任何 shard 失败都必须让汇总检查失败。
  data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [data-contract-shards]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: 汇总 shard 结果并校验数据摘要
        env:
          SHARD_RESULT: ${{ needs.data-contract-shards.result }}
        run: |
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "data-contract shard 未全部成功：$SHARD_RESULT"
            exit 1
          fi
          python3 scripts/summarize_data_contract.py

  # 同上：含 tests/fixtures 大麦套件，实测 20 分钟不足
  # 2026-09-29 用户批准：实测 32→37→40+ 分钟贴近 40 分钟上限（曾两次超时取消整 run），放宽至 45 对齐 integration
  intake-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make test-intake-e2e

  metrics-known-answers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make test-metrics-known-answers

  analysis-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make test-analysis-invariants

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-dashboard
      - run: cd services/api && uv run pytest tests/dashboard -q
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dashboard-playwright-report
          path: playwright-report/
          retention-days: 14

  investigation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-investigation-e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: investigation-playwright-report
          path: playwright-report/
          retention-days: 14

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make contracts-check

  copilot-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make infra-up
      - run: cd services/api && uv run alembic upgrade head
      - run: make test-copilot-evals

  publishing-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-publishing-golden
      - run: cd services/api && uv run pytest tests/publishing -q

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: docker compose -f infra/compose.yaml up -d --wait --wait-timeout 120 postgres
      - run: uv run scripts/wait_for_services.py localhost:5432
      - run: cd services/api && uv run python ../../scripts/check_migrations.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make stack-up
      - run: curl --fail http://localhost:8000/api/v1/health
      - run: curl --fail http://localhost:3000/
      - run: docker compose -f infra/compose.yaml exec -T worker celery -A flow_api.worker:celery_app inspect ping

  module-boundaries-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          # 2026-09-29 用户批准：本 job 只跑 pnpm/playwright、从不执行 uv 命令，
          # 开缓存会让 setup-uv 的 post-run 保存步骤因缓存目录不存在而必失败。
          enable-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx --yes pnpm@10.17.1 install --frozen-lockfile
      - run: npx --yes pnpm@10.17.1 --filter @flow/web exec playwright install --with-deps chromium
      - run: bash scripts/test_module_boundaries_e2e.sh
      - if: failure()
        run: find apps/web/test-results -name "*.md" -exec cat {} \; 2>/dev/null || true

  user-closure-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@10.17.1 install --frozen-lockfile
      - run: cd services/api && uv sync --all-groups --frozen
      - run: npx --yes pnpm@10.17.1 --filter @flow/web exec playwright install --with-deps chromium
      - run: FLOW_USER_CLOSURE_ONLY=1 bash scripts/test_user_closure_e2e.sh
      - if: failure()
        run: find apps/web/test-results -name "*.md" -exec cat {} \; 2>/dev/null || true

  l0-baseline:
    # 2026-10-16 用户裁决 1C：非阻断信号灯（continue-on-error），不阻塞合并
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd services/api && uv sync --all-groups --frozen
      - name: L0 baseline check (1532 facts + 1776 anchors, non-blocking signal)
        run: |
          cd services/api
          DATABASE_URL="postgresql+psycopg://flow:flow_dev_only@localhost:5432/flow" uv run python ../../scripts/l0_baseline_check.py || echo "::warning::L0 baseline check failed (non-blocking signal)"
