name: FLOW CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://flow:flow_dev_only@localhost:5432/flow
  REDIS_URL: redis://localhost:6379/0
  S3_ENDPOINT_URL: http://localhost:9000
  S3_BUCKET: flow
  S3_ACCESS_KEY: flow
  S3_SECRET_KEY: flow_dev_only

jobs:
  static-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # M0 基线校验需要完整 git 历史回放 checkpoint
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: cd services/api && uv run ruff check src tests && uv run mypy src
      - run: cd services/api && uv run python -m unittest discover -s ../../scripts/tests -t ../.. -v
      - run: cd services/api && uv run pytest ../../scripts/tests/test_verify_workflow_jobs.py -q
      - run: python3 scripts/check_docs.py --phase m6

  static-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint && pnpm -r typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep this job independent of PostgreSQL, including on developer machines.
      DATABASE_URL: postgresql+psycopg://flow:flow_dev_only@127.0.0.1:1/flow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: >-
          cd services/api && uv run pytest
          tests/domain tests/api/test_auth_boundary.py
          tests/api/test_workspace.py tests/test_health.py
          tests/security/test_authorization.py -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make infra-up
      - run: cd services/api && uv run alembic upgrade head
      - run: >-
          cd services/api && uv run pytest tests/integration tests/investigation tests/copilot
          tests/api -q
          --ignore=tests/api/test_auth_boundary.py
          --ignore=tests/api/test_workspace.py
      # T11-G2 性能回归门禁（用户批准）：10× 合成规模下三类读路径 P95 ≤ 50ms
      # （本地基线 6.23/0.97/1.11ms 的 8-50 倍余量，只拦数量级劣化；CI 硬件差异见
      # docs/60_delivery/2026-09-15-cainiao-stress-test-report.md）
      - name: perf gate (10x scale)
        run: >-
          cd services/api &&
          bash ../../scripts/seed_p5_statements.sh > /dev/null &&
          uv run python ../../scripts/perf_baseline.py --scale 10 --max-p95 50

  # 大麦 fixture 套件（多次真实 seed）使本门禁翻倍，20 分钟预算已撞线
  data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make test-data-contract

  # 同上：含 tests/fixtures 大麦套件，实测 20 分钟不足
  intake-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make test-intake-e2e

  metrics-known-answers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make test-metrics-known-answers

  analysis-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make test-analysis-invariants

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-dashboard
      - run: cd services/api && uv run pytest tests/dashboard -q
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dashboard-playwright-report
          path: playwright-report/
          retention-days: 14

  investigation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-investigation-e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: investigation-playwright-report
          path: playwright-report/
          retention-days: 14

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make contracts-check

  copilot-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make infra-up
      - run: cd services/api && uv run alembic upgrade head
      - run: make test-copilot-evals

  publishing-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-publishing-golden
      - run: cd services/api && uv run pytest tests/publishing -q

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: docker compose -f infra/compose.yaml up -d --wait --wait-timeout 120 postgres
      - run: uv run scripts/wait_for_services.py localhost:5432
      - run: cd services/api && uv run python ../../scripts/check_migrations.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make stack-up
      - run: curl --fail http://localhost:8000/api/v1/health
      - run: curl --fail http://localhost:3000/
      - run: docker compose -f infra/compose.yaml exec -T worker celery -A flow_api.worker:celery_app inspect ping

  module-boundaries-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx --yes pnpm@10.17.1 install --frozen-lockfile
      - run: npx --yes pnpm@10.17.1 --filter @flow/web exec playwright install --with-deps chromium
      - run: bash scripts/test_module_boundaries_e2e.sh
      - if: failure()
        run: find apps/web/test-results -name "*.md" -exec cat {} \; 2>/dev/null || true

  user-closure-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@10.17.1 install --frozen-lockfile
      - run: cd services/api && uv sync --all-groups --frozen
      - run: npx --yes pnpm@10.17.1 --filter @flow/web exec playwright install --with-deps chromium
      - run: FLOW_USER_CLOSURE_ONLY=1 bash scripts/test_user_closure_e2e.sh
      - if: failure()
        run: find apps/web/test-results -name "*.md" -exec cat {} \; 2>/dev/null || true
