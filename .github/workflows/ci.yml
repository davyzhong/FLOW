name: FLOW CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://flow:flow_dev_only@localhost:5432/flow
  REDIS_URL: redis://localhost:6379/0
  S3_ENDPOINT_URL: http://localhost:9000
  S3_BUCKET: flow
  S3_ACCESS_KEY: flow
  S3_SECRET_KEY: flow_dev_only

jobs:
  static-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: cd services/api && uv run ruff check src tests && uv run mypy src

  static-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint && pnpm -r typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: cd services/api && uv run pytest tests/domain tests/api tests/test_health.py -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make infra-up
      - run: cd services/api && uv run pytest tests/integration -q

  data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: make test-data-contract

  intake-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make test-intake-e2e

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make contracts-check

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: cd services/api && uv sync --all-groups --frozen
      - run: docker compose -f infra/compose.yaml up -d --wait --wait-timeout 120 postgres
      - run: uv run scripts/wait_for_services.py localhost:5432
      - run: cd services/api && uv run python ../../scripts/check_migrations.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: make bootstrap
      - run: make stack-up
      - run: curl --fail http://localhost:8000/api/v1/health
      - run: curl --fail http://localhost:3000/
      - run: docker compose -f infra/compose.yaml exec -T worker celery -A flow_api.worker:celery_app inspect ping
