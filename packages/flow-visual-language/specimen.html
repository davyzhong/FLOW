<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FLOW 可移植视觉语言样例</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--flow-vl-colors-surface-canvas); color: var(--flow-vl-colors-text-primary); font-family: var(--flow-vl-typography-family-body); line-height: var(--flow-vl-typography-line-height-body); }
      .shell { min-height: 100vh; display: grid; grid-template-columns: 190px minmax(0, 1fr); }
      nav { background: var(--flow-vl-colors-surface-nav); color: var(--flow-vl-colors-text-inverse); padding: var(--flow-vl-space-6) var(--flow-vl-space-4); }
      .brand { color: var(--flow-vl-colors-brand-gold); font: 600 var(--flow-vl-typography-size-xl) var(--flow-vl-typography-family-display); letter-spacing: .06em; }
      nav p { color: rgb(251 248 240 / 70%); font-size: var(--flow-vl-typography-size-sm); margin: var(--flow-vl-space-2) 0 var(--flow-vl-space-6); }
      nav a { display: block; border-left: 2px solid var(--flow-vl-colors-brand-gold); background: rgb(255 255 255 / 8%); color: inherit; padding: 10px 12px; text-decoration: none; border-radius: 0 var(--flow-vl-radius-md) var(--flow-vl-radius-md) 0; }
      main { width: min(1160px, 100%); margin: auto; padding: clamp(20px, 4vw, 52px); }
      header { display: flex; justify-content: space-between; align-items: start; gap: var(--flow-vl-space-5); margin-bottom: var(--flow-vl-space-6); }
      h1 { font: 600 clamp(1.75rem, 3vw, 2.5rem)/1.25 var(--flow-vl-typography-family-display); margin: 0; letter-spacing: .03em; }
      .eyebrow { color: var(--flow-vl-colors-brand-gold-strong); font-size: var(--flow-vl-typography-size-xs); letter-spacing: .12em; text-transform: uppercase; }
      .intro { max-width: 660px; color: var(--flow-vl-colors-text-secondary); }
      .tag { border: 1px solid var(--flow-vl-colors-line-default); border-radius: var(--flow-vl-radius-pill); padding: 4px 10px; color: var(--flow-vl-colors-text-muted); white-space: nowrap; font-size: var(--flow-vl-typography-size-xs); }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--flow-vl-space-4); }
      .panel { background: var(--flow-vl-colors-surface-raised); border: 1px solid var(--flow-vl-colors-line-subtle); border-radius: var(--flow-vl-radius-lg); box-shadow: var(--flow-vl-shadow-panel); padding: var(--flow-vl-space-5); }
      .label { color: var(--flow-vl-colors-text-muted); font-size: var(--flow-vl-typography-size-sm); }
      .value { font: 600 var(--flow-vl-typography-size-xl) var(--flow-vl-typography-family-numeric); font-variant-numeric: tabular-nums; margin: 6px 0; }
      .swatches { display: flex; gap: 8px; margin-top: 12px; }
      .swatch { height: 18px; flex: 1; border-radius: 3px; }
      .sample-row { display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--flow-vl-space-4); margin-top: var(--flow-vl-space-4); }
      .chart-placeholder { height: 180px; margin-top: 12px; border: 1px dashed var(--flow-vl-colors-line-strong); border-radius: var(--flow-vl-radius-md); display: grid; place-items: center; color: var(--flow-vl-colors-text-muted); background: linear-gradient(to bottom, transparent 32%, var(--flow-vl-colors-line-subtle) 33%, transparent 34%, transparent 65%, var(--flow-vl-colors-line-subtle) 66%, transparent 67%); font-size: var(--flow-vl-typography-size-sm); }
      .gold-note { border-left: 3px solid var(--flow-vl-colors-brand-gold); padding: 10px 14px; background: var(--flow-vl-colors-brand-gold-soft); border-radius: 0 var(--flow-vl-radius-md) var(--flow-vl-radius-md) 0; }
      @media (max-width: 820px) { .shell { grid-template-columns: 1fr; } nav { padding: 14px 20px; } nav p, nav a { display: none; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sample-row { grid-template-columns: 1fr; } header { flex-direction: column; } }
      @media (max-width: 420px) { main { padding: 20px 14px; } .panel { padding: 16px; } .grid { gap: 10px; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav aria-label="样例导航"><div class="brand">FLOW</div><p>视觉语言样例</p><a href="#canvas">页面画布</a></nav>
      <main id="canvas">
        <header><div><div class="eyebrow">Editorial finance canvas</div><h1>页面标题样式</h1><p class="intro">导语以短句说明页面任务。该样例只展示排版、颜色和信息层次，不展示真实或虚构的业务结论。</p></div><span class="tag">占位样例 · 无业务数据</span></header>
        <section class="grid" aria-label="指标卡样式"><article class="panel"><div class="label">指标名称</div><div class="value">—</div><div class="label">单位与期间说明</div></article><article class="panel"><div class="label">指标名称</div><div class="value">—</div><div class="label">比较口径说明</div></article><article class="panel"><div class="label">语义色</div><div class="swatches"><span class="swatch" style="background:var(--flow-vl-colors-data-revenue)"></span><span class="swatch" style="background:var(--flow-vl-colors-data-profit)"></span><span class="swatch" style="background:var(--flow-vl-colors-data-cash)"></span></div></article><article class="panel"><div class="label">状态色</div><div class="swatches"><span class="swatch" style="background:var(--flow-vl-colors-semantic-positive)"></span><span class="swatch" style="background:var(--flow-vl-colors-semantic-warning)"></span><span class="swatch" style="background:var(--flow-vl-colors-semantic-negative)"></span></div></article></section>
        <div class="sample-row"><section class="panel"><div class="label">图表区占位 · 无数据序列</div><div class="chart-placeholder">图表标题、期间、单位与同值说明在此呈现</div></section><section class="panel"><div class="label">来源与口径面板</div><p>来源说明和限制与支持内容并列呈现。</p><div class="gold-note">强调色用于提示阅读层次，不代表正向状态。</div></section></div>
      </main>
    </div>
  </body>
</html>
