name: flow

services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment: &application-environment
      FLOW_ENV: development
      FLOW_TIMEZONE: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://flow:flow_dev_only@postgres:5432/flow
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: flow
      S3_ACCESS_KEY: flow
      S3_SECRET_KEY: flow_dev_only
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on: &application-dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      FLOW_API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flow
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - flow-postgres:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flow
      MINIO_ROOT_PASSWORD: flow_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - flow-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 flow flow_dev_only &&
      mc mb --ignore-existing local/flow"

  worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    command: celery -A flow_api.worker:celery_app worker --loglevel=INFO --concurrency=2
    environment: *application-environment
    depends_on: *application-dependencies

volumes:
  flow-postgres:
  flow-minio:
