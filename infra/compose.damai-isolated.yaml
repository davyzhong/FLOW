# 大麦演示验收用独立 compose project（Task C1），自足文件而非 override：
#   docker compose -p damai-demo-iso -f infra/compose.damai-isolated.yaml up -d --wait
# 端口整体外移，与主开发栈（flow project）并存互不干扰；卷独立，验收后 down -v。
name: damai-demo-iso

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flow
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow_dev_only
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - damai-iso-postgres:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    # quay.io/minio 已私有化、Docker Hub minio org 已删除；改用 bitnamilegacy
    # 同版本镜像（详见 infra/compose.yaml 注释），root + 官方 entrypoint 保持 /data 语义。
    image: bitnamilegacy/minio:2025.4.22
    user: "0:0"
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flow
      MINIO_ROOT_PASSWORD: flow_dev_only
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "/opt/bitnami/minio-client/bin/mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - damai-iso-minio:/data

  minio-init:
    image: bitnamilegacy/minio-client:latest
    user: "0:0"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 flow flow_dev_only &&
      mc mb --ignore-existing local/flow"

volumes:
  damai-iso-postgres:
  damai-iso-minio:
