[project]
name = "flow-api"
version = "0.1.0"
description = "FLOW Finance Intelligence API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "celery>=5.5,<6",
  "fastapi>=0.116,<1",
  "openpyxl>=3.1,<4",
  "polars>=1.33,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=6.4,<7",
  "sqlalchemy>=2.0,<3",
  "uuid6>=2025.0.1,<2027",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["flow_api"]
