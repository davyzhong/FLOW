sample: alibaba_segment_series
company: "阿里巴巴集团控股（9988.HK / NYSE: BABA）"
unit: 人民币百万元
note: >-
  分部收入与经调整 EBITA 年度序列（FY2019–FY2026）。阿里分部架构经历三次重述：
  FY2019–FY2021 为「核心商業/雲計算/數字媒體及娛樂/創新業務及其他」四分部；
  FY2022–FY2023 为「中國商業/國際商業/本地生活/菜鳥/雲業務/數媒/創新」七分部；
  FY2024–FY2025 为六大业务集团架构（淘天/雲智能/AIDC/菜鳥/本地生活/大文娛/所有其他）；
  FY2026 起整合为「阿里巴巴中國電商集團/AIDC/雲智能/所有其他」四分部
  （菜鳥、高德、大文娛归入所有其他）。
  每年数值取自该年公告本期列（重述口径以各年公告为准，不做跨架构拼接）；
  分部间抵消与未分摊单列；EBITA 分部合计与合并数差异（如有）为未披露项，不凑整。
  页码为 PDF 物理页（各年公告印刷页 = 物理页 - 1 或相同，以文件内标注为准）。
sources:
  FY2019: BABA_FY2020_annual_results.pdf p25（收入）/ p30（EBITA）——FY2020 公告上期列
  FY2020: BABA_FY2020_annual_results.pdf p25 / p30
  FY2021: BABA_FY2021_annual_results.pdf p23 / p27
  FY2022: BABA_FY2022_annual_results.pdf p27 / p32
  FY2023: BABA_FY2023_annual_results.pdf p25（收入）/ p23 全年分部信息（EBITA）
  FY2024: BABA_FY2024_annual_results.pdf p20 / p21
  FY2025: BABA_FY2025_annual_results.pdf p18 / p19
  FY2026: BABA_FY2026_annual_results.pdf p18 / p19
