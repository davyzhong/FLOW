# 科目余额表指标目录（R5 九页接线，work_item FLOW-WI-REAL-DATA-IMPORT-20261028-001）
#
# 边界（不虚构口径）：
# - 只收录科目余额表可真实推导的七项指标，与 importer/normalization.derive_metrics
#   同码同式；治理链快照值必须与直读派生值全等（tests/importer 口径等价测试）。
# - 毛利率、DSO、经营现金流等需要收入/成本分项、账龄或现金流量表数据，
#   科目余额表推导不出，一律不设指标。
# - financial_account 显式绑定五管理科目（桥接层按科目类别聚合写入
#   FactFinancialActual）；flow_v1 目录与引擎兜底绑定不受影响。
definition_set_id: flow.metrics.trial-balance.v1
engine_version: flow.metrics.engine.v1
metrics:
  - metric_code: revenue
    version: 1
    name: 营业收入
    business_definition: 损益类科目本期贷方发生额合计（科目余额表推导）。
    formula: sum_financial_account_amount
    financial_account: TB_REVENUE
    dependencies: []
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: &tb_dimensions
      - []
      - [organization]
    budget_dimension_sets: []

  - metric_code: total_expenses
    version: 1
    name: 费用总额
    business_definition: 损益类科目本期借方发生额合计（科目余额表推导）。
    formula: sum_financial_account_amount
    financial_account: TB_EXPENSE
    dependencies: []
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: net_profit
    version: 1
    name: 净利润
    business_definition: 营业收入减费用总额（损益类贷方减借方发生额）。
    formula: subtract
    dependencies: [revenue, total_expenses]
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: total_assets
    version: 1
    name: 资产总计
    business_definition: 资产类科目期末余额（借向）合计（科目余额表推导）。
    formula: sum_financial_account_amount
    financial_account: TB_ASSET
    dependencies: []
    aggregation: closing_balance
    time_behavior: balance
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: total_liabilities
    version: 1
    name: 负债总计
    business_definition: 负债类科目期末余额（贷向）合计（科目余额表推导）。
    formula: sum_financial_account_amount
    financial_account: TB_LIABILITY
    dependencies: []
    aggregation: closing_balance
    time_behavior: balance
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: total_equity
    version: 1
    name: 权益总计
    business_definition: 权益类科目期末余额（贷向）合计（科目余额表推导）。
    formula: sum_financial_account_amount
    financial_account: TB_EQUITY
    dependencies: []
    aggregation: closing_balance
    time_behavior: balance
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: debt_ratio
    version: 1
    name: 资产负债率
    business_definition: 负债总计除以资产总计（期末口径）。
    formula: ratio
    dependencies: [total_liabilities, total_assets]
    aggregation: ratio
    time_behavior: balance
    unit: ratio
    output_scale: 6
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  # —— M1 科目级映射（资产负债结构；前缀映射组、组内方向净额）——
  # 口径：明细组来自科目编码前缀映射（config/importer/account_mapping_v1.yaml），
  # 未命中科目不进组；类别合计（上表）不变。
  - metric_code: cash
    version: 1
    name: 货币资金
    business_definition: 货币资金组科目期末方向净额（现金/银行存款等前缀组）。
    formula: sum_financial_account_amount
    financial_account: TB_CASH
    dependencies: []
    aggregation: closing_balance
    time_behavior: balance
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: receivables
    version: 1
    name: 应收账款
    business_definition: 应收账款组科目期末方向净额。
    formula: sum_financial_account_amount
    financial_account: TB_AR
    dependencies: []
    aggregation: closing_balance
    time_behavior: balance
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: inventory
    version: 1
    name: 存货
    business_definition: 存货组科目期末方向净额。
    formula: sum_financial_account_amount
    financial_account: TB_INVENTORY
    dependencies: []
    aggregation: closing_balance
    time_behavior: balance
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: fixed_assets
    version: 1
    name: 固定资产净额
    business_definition: 固定资产组期末方向净额（借向原值−贷向折旧/减值）。
    formula: sum_financial_account_amount
    financial_account: TB_FIXED_ASSET
    dependencies: []
    aggregation: closing_balance
    time_behavior: balance
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: accounts_payable
    version: 1
    name: 应付账款
    business_definition: 应付账款组科目期末方向净额。
    formula: sum_financial_account_amount
    financial_account: TB_AP
    dependencies: []
    aggregation: closing_balance
    time_behavior: balance
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  # —— M2 利润表接线（损益结构与毛利；损益明细唯一来源=利润表 IS_* 项目）——
  # 口径：revenue 仍=科目余额表损益贷方发生额合计（R5 基线零扰动），
  # 毛利率分母即该口径；无利润表时下列指标如实缺席（不虚构）。
  - metric_code: operating_cost
    version: 1
    name: 营业成本
    business_definition: 利润表营业成本本期金额（损益明细来自利润表）。
    formula: sum_financial_account_amount
    financial_account: IS_COST
    dependencies: []
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: gross_profit
    version: 1
    name: 毛利
    business_definition: 收入减营业成本（收入为损益贷方发生额合计口径）。
    formula: subtract
    dependencies: [revenue, operating_cost]
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: gross_margin
    version: 1
    name: 毛利率
    business_definition: 毛利除以收入（收入为损益贷方发生额合计口径）。
    formula: ratio
    dependencies: [gross_profit, revenue]
    aggregation: ratio
    time_behavior: flow
    unit: ratio
    output_scale: 6
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: selling_expense
    version: 1
    name: 销售费用
    business_definition: 利润表销售费用本期金额。
    formula: sum_financial_account_amount
    financial_account: IS_SELLING
    dependencies: []
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: admin_expense
    version: 1
    name: 管理费用
    business_definition: 利润表管理费用本期金额。
    formula: sum_financial_account_amount
    financial_account: IS_ADMIN
    dependencies: []
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: rd_expense
    version: 1
    name: 研发费用
    business_definition: 利润表研发费用本期金额。
    formula: sum_financial_account_amount
    financial_account: IS_RD
    dependencies: []
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: finance_expense
    version: 1
    name: 财务费用
    business_definition: 利润表财务费用本期金额。
    formula: sum_financial_account_amount
    financial_account: IS_FINANCE
    dependencies: []
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  # —— M3 银行流水接线（现金收付实现制口径）——
  # 口径红线：不绑 dashboard 的 operating_cash_flow（权责发生制 OCF），
  # 现金流量口径只出以下三项；无流水时如实缺席。
  - metric_code: cash_inflow
    version: 1
    name: 现金流入
    business_definition: 银行流水收入金额期间合计（现金收付口径）。
    formula: sum_financial_account_amount
    financial_account: CASH_INFLOW
    dependencies: []
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: cash_outflow
    version: 1
    name: 现金流出
    business_definition: 银行流水支出金额期间合计（现金收付口径）。
    formula: sum_financial_account_amount
    financial_account: CASH_OUTFLOW
    dependencies: []
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []

  - metric_code: net_cash_flow
    version: 1
    name: 净现金流
    business_definition: 现金流入减现金流出（现金收付口径，非权责 OCF）。
    formula: subtract
    dependencies: [cash_inflow, cash_outflow]
    aggregation: sum
    time_behavior: flow
    unit: CNY
    output_scale: 4
    allowed_dimension_sets: *tb_dimensions
    budget_dimension_sets: []
