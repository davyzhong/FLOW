entry_templates:
- template_id: ET01_service_revenue_credit
  scenario: 提供运输/仓储服务，月末按账单确认收入（赊销）
  business_context: 物流核心收入确认；战略客户月结账期场景
  lines:
  - direction: 借
    account: 1122 应收账款
    amount_rule: 价税合计账单金额
  - direction: 贷
    account: 6001 主营业务收入
    amount_rule: 不含税服务费
  - direction: 贷
    account: 2221 应交税费——应交增值税（销项税额）
    amount_rule: 适用税率计算
  standard_ref: CAS-14 / CAS-APPENDIX-2006「1122」「6001」
  related_metrics:
  - revenue
  - ar_balance
  - dso
  - ar_turnover
- template_id: ET02_service_revenue_cash
  scenario: 现结服务收入
  lines:
  - direction: 借
    account: 1002 银行存款
    amount_rule: 实收价税合计
  - direction: 贷
    account: 6001 主营业务收入
    amount_rule: 不含税金额
  - direction: 贷
    account: 2221 应交税费——应交增值税（销项税额）
    amount_rule: 适用税率计算
  standard_ref: CAS-14
  related_metrics:
  - revenue
  - cash_revenue_ratio
- template_id: ET03_customer_collection
  scenario: 收到客户回款
  lines:
  - direction: 借
    account: 1002 银行存款
