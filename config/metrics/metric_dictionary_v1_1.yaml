      - op: prior
        args:
        - bs.equity
    - op: prior
      args:
      - bs.equity
  unit: '%'
  time_behavior: point_balance
  caliber: 教科书标准口径。
  source_cas:
  - 所有者权益合计
  source_ifrs: equity growth
  depends_on: []
