  formula:
    op: div
    args:
    - op: sub
      args:
      - bs.total_assets
      - op: prior
        args:
        - bs.total_assets
    - op: prior
      args:
      - bs.total_assets
  unit: '%'
  time_behavior: point_balance
  caliber: 教科书标准口径。
  source_cas:
