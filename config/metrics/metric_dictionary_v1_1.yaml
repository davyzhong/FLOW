    verified: false
    condition: 随 EBITDA 继承——仅当于公开财报列报时属 IFRS 18 MPM 候选；本库不静态授予监管标签。
    basis: IFRS 18（IASB，2024-05 发布，2027-01-01 起生效）B116–B118（提前参照）。
  reconciliation: 随 EBITDA 口径继承调节关系。
  provenance: research/08 §3
  tier: professional
  analysis_dimensions: *id003
- metric_code: revenue_growth
  name: 营业收入增长率
