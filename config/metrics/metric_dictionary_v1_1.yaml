  provenance: research/08 §1
  tier: professional
  analysis_dimensions: *id004
- metric_code: cash_revenue_ratio
  name: 现金收入比
  domain: cashflow
  definition: 销售商品、提供劳务收到的现金与营业总收入之比，收入的现金含量。
  formula_text: 销售商品、提供劳务收到的现金 ÷ 营业总收入 × 100%
  formula:
    op: div
    args:
    - cf.cash_from_sales
    - is.revenue
  unit: '%'
  time_behavior: period_flow
  caliber: 联合资信评级口径；分子含增值税销项税，指标可大于 100%。
  source_cas:
  - 销售商品、提供劳务收到的现金
  - 营业收入
  source_ifrs: cash receipts from customers / revenue (IAS 7)
  depends_on: []
  benchmark: 物流央企实例约 108%（中国物流集团）；持续低于 100% 须查收入质量。
  mpm: false
  provenance: research/08 §3；research/09 §4.1
  tier: professional
  analysis_dimensions:
  - cash_link
  - benchmark
- metric_code: ocf_net_profit_ratio
  name: 盈利现金比率
  aliases:
  - 净利润现金含量
  domain: cashflow
  definition: 经营活动现金流量净额与净利润之比，利润的现金成色。
  formula_text: 经营活动现金流量净额 ÷ 净利润
  formula:
    op: div
    args:
    - cf.ocf
    - is.net_profit
  unit: 倍
  time_behavior: period_flow
  caliber: 净利润为负时指标失真，降级为绝对额展示。
  source_cas:
  - 经营活动产生的现金流量净额
  - 净利润
  source_ifrs: operating cash flow / profit
  depends_on: []
  benchmark: 长期显著小于 1 提示利润质量或回款问题。
  mpm: false
  provenance: research/08 §1
  tier: core
  analysis_dimensions:
  - cash_link
  - warning
  - trend
- metric_code: free_cash_flow
  name: 自由现金流
  aliases:
  - FCF
  domain: cashflow
  definition: 经营现金流扣除资本开支后可自由支配的现金。
  formula_text: 经营活动现金流量净额 − 购建长期资产支付的现金
  formula:
    op: sub
    args:
    - cf.ocf
    - cf.capex
  unit: 元
  time_behavior: period_flow
  caliber: FCF 属管理常用口径指标，资本开支边界（是否含租赁付款、并购）须按口径版本记录。FCF 不是现金流量表定义的现金科目，禁止与货币资金或经营活动现金流量净额混称（C03）。
  source_cas:
  - 经营活动产生的现金流量净额
  - 购建固定资产、无形资产和其他长期资产支付的现金
  source_ifrs: free cash flow（非 IFRS 定义指标；如于公开财报列报则属 IFRS 18 MPM 候选）
  depends_on: []
  benchmark: 持续为负须解释资金来源。
  mpm: false
  mpm_review:
    determination: candidate
    verified: false
    condition: 仅当企业在公开财务报表中实际列报 FCF 时即属 IFRS 18 MPM，须调节并披露；本库不静态授予监管标签。
    basis: IFRS 18（IASB，2024-05 发布，2027-01-01 起生效）B116–B118 管理定义业绩指标；EY/KPMG 实务指引（提前参照）。
  reconciliation: 调节至经营活动现金流量净额（法定现金流量表行项目），调节项为资本开支等。
  provenance: research/09 §3
  default_caliber: 经营活动现金流量净额 − 购建固定资产、无形资产和其他长期资产支付的现金（资本开支仅含购建付现）
  default_basis: CPA 教材标准口径（管理用报表简化版）
  alternative_calibers:
  - 含租赁付款本金与并购的扩展资本开支口径（MPM，须调节披露）
  tier: core
  analysis_dimensions:
  - cash_link
  - value
- metric_code: cash_short_debt_ratio
  name: 现金短期债务比
  domain: cashflow
  definition: 现金类资产对短期债务的覆盖倍数。
  formula_text: 现金类资产 ÷ 短期债务
  formula:
    op: div
    args:
    - bs.cash
    - bs.short_debt
  unit: 倍
  time_behavior: point_balance
  caliber: 联合资信评级口径；现金类资产是否含交易性金融资产须标注。
  source_cas:
  - 货币资金
  - 短期借款
  source_ifrs: cash / current borrowings
  depends_on: []
  benchmark: 物流央企实例 0.9–1.34 倍（中国物流集团）。
  mpm: false
  provenance: research/08 §3
  default_caliber: 现金类资产 = 货币资金 + 交易性金融资产
  default_basis: 联合资信评级附件口径
  alternative_calibers:
  - 仅货币资金（最保守）
  tier: professional
  analysis_dimensions:
  - warning
  - trend
- metric_code: debt_ebitda
  name: 全部债务 / EBITDA
  domain: cashflow
  definition: 全部债务相当于 EBITDA 的倍数，债务清偿所需年限的近似度量。
  formula_text: （短期债务 + 长期债务）÷ EBITDA
  formula:
    op: div
    args:
    - op: add
      args:
      - bs.short_debt
      - bs.long_debt
    - ebitda
  unit: 倍
  time_behavior: period_flow
  caliber: 联合资信评级口径；分子为时点、分母为期间，须注意口径混合。
  source_cas:
  - 短期借款
  - 长期借款
  - 利润总额
  - 利息费用
  - 折旧与摊销
  source_ifrs: total debt / EBITDA
  depends_on:
  - ebitda
  benchmark: 物流央企实例 4.5–7.5 倍（中国物流集团）；倍数越高偿债压力越大。
  mpm: false
  provenance: research/08 §3
  tier: professional
  analysis_dimensions:
  - warning
  - benchmark
- metric_code: ccc_days
  name: 现金周转周期
  domain: operation
  definition: 从付现给供应商到从客户收现的平均天数（净营业周期），衡量营运资金占用时长。
  formula_text: 存货周转天数（DIO）+ 应收账款周转天数（DSO）− 应付账款周转天数（DPO）
  formula:
    op: sub
    args:
    - op: add
      args:
      - dio_days
      - dso_days
    - dpo_days
  unit: 天
  time_behavior: period
  caliber: CFA/CFI 标准定义（净营业周期）；与联合资信附件「净营业周期」同族。
  source_cas:
  - 存货
  - 应收账款
  - 应付账款
  - 营业收入
  - 营业成本
  source_ifrs: inventories / trade receivables / trade payables (IAS 1)
  depends_on:
  - dio_days
  - dso_days
  - dpo_days
  benchmark: 行业差异大；负值表示占用上游资金（强议价）；持续上升提示营运资金占用恶化，需结合业务模式评估。
  mpm: false
  provenance: 'research/2026-09-11-25-indicators-article #20 + 调研 08 §3（联合资信净营业周期）'
  tier: core
  analysis_dimensions:
  - trend
  - benchmark
  - warning
- metric_code: ocf_interest_coverage
  name: 现金流利息覆盖
  domain: solvency
  definition: 经营活动现金流量净额对利息费用的保障倍数，从收付实现制衡量付息能力。
  formula_text: 经营活动产生的现金流量净额 ÷ 利息费用
  formula:
    op: div
    args:
    - cf.ocf
    - is.interest_exp
  unit: 倍
  time_behavior: period
  caliber: 收付实现制口径；分母为费用化利息支出。与 interest_coverage（EBIT 权责口径）配对阅读。
  source_cas:
  - 经营活动产生的现金流量净额
  - 财务费用—利息费用
  source_ifrs: net cash from operating activities (IAS 7) / finance costs
  depends_on: []
  benchmark: 显著低于 EBIT 口径利息保障倍数，提示利润未转化为付息现金；两口径长期背离须复核利润质量。
  mpm: false
  provenance: 'research/2026-09-11-25-indicators-article #16'
  tier: professional
  analysis_dimensions:
  - warning
  - cash_link
- metric_code: ocf_total_debt_ratio
  name: 现金流总债务比
  domain: cashflow
  definition: 经营活动现金流量净额对全部债务的覆盖程度，衡量以经营现金偿还全部有息债务的能力。
  formula_text: 经营活动产生的现金流量净额 ÷（短期有息债务 + 长期有息债务）
  formula:
    op: div
    args:
    - cf.ocf
    - op: sum
      args:
      - bs.short_debt
      - bs.long_debt
  unit: 倍
  time_behavior: point_balance
  caliber: 分母为有息债务合计；信用分析与杠杆收购语境常用，使用时须结合资本性支出需求。
  source_cas:
  - 经营活动产生的现金流量净额
  - 短期借款
  - 长期借款
  - 应付债券
  source_ifrs: borrowings (IFRS 7/9)
  depends_on: []
  benchmark: 与 free_cash_flow 交叉验证（扣除 CAPEX 后的真偿债能力）；持续低于行业均值提示再融资依赖。
  mpm: false
  provenance: 'research/2026-09-11-25-indicators-article #17'
  tier: professional
  analysis_dimensions:
  - warning
  - cash_link
- metric_code: roic
  name: 投入资本回报率
  domain: profitability
  definition: 税后净营业利润（NOPAT）对投入资本（有息负债+股东权益）的回报率，与资本成本（WACC）对比判断是否创造价值。
  formula_text: NOPAT ÷（有息负债 + 股东权益）；NOPAT = 净利润 +（利息支出 + 研发费用调整项）×（1 − 所得税率）
  formula:
    op: div
    args:
    - nopat
    - op: sum
      args:
      - bs.short_debt
      - bs.long_debt
      - bs.equity
  unit: '%'
  time_behavior: period
  caliber: NOPAT 口径（税后经营利润，利息加回）。与 roce（联合资信总资本收益率：(净利润+利息支出)÷(权益+全部债务)）为同族不同口径，跨源对比须先对齐。
  source_cas:
  - 净利润
  - 利息费用
  - 研发费用
  - 短期借款
  - 长期借款
  - 所有者权益
  source_ifrs: invested capital = interest-bearing debt + equity
  depends_on: []
  benchmark: ROIC > WACC 才创造价值；WACC 估算主观，结论须给出资本成本取值区间。
  mpm: false
  provenance: '借鉴 #13/#18 v1.1 候选落地（2026-09-12）；NOPAT 调整项按国资委 EVA 口径'
  tier: professional
  analysis_dimensions:
  - value
  - benchmark
- metric_code: eva
  name: 经济增加值
  domain: value
  definition: 税后净营业利润减去全部资本成本后的余额（国资委央企负责人业绩考核核心指标），衡量超过资本成本的价值创造。
  formula_text: EVA = NOPAT − 调整后资本 × 资本成本率；央企口径资本成本率原则上 5.5%（军工等 4.1%；资产负债率超标上浮 0.5
    个百分点），研发费用视同利润加回
  formula:
    op: sub
    args:
    - nopat
    - op: mul
      args:
      - invested_capital
      - wacc
  unit: 元
  time_behavior: period
  caliber: 国资委《中央企业负责人经营业绩考核暂行办法》口径；NOPAT = 净利润 +（利息支出 + 研发费用调整项）×（1 − 所得税率），调整项含非经常性收益与无息流动负债。
  source_cas:
  - 净利润
  - 利息费用
  - 研发费用
  - 所有者权益
  - 有息债务
  source_ifrs: residual income (Stern Stewart EVA framework)
  depends_on: []
  benchmark: WACC/资本成本率取值主观性强，只作长期价值分析参考，不得仅凭 EVA 单独下创造价值结论（原文与国资委口径一致）。
  mpm: false
  provenance: 'research/2026-09-11-25-indicators-article #24 + 国资委考核办法（2026-09-12
    权威口径核查）'
  tier: professional
  analysis_dimensions:
  - value
  - benchmark
- metric_code: sgr
  name: 可持续增长率
  domain: growth
  definition: 不追加外部融资、仅靠留存利润支撑的理论最大销售增长率。
  formula_text: ROE ×（1 − 分红率）
  formula:
    op: mul
    args:
    - roe
    - op: sub
      args:
      - identity_1
      - payout_ratio
  unit: '%'
  time_behavior: period
  caliber: Higgins 经典口径（期初权益）；实务常用期末权益 ROE 近似，须标注分母口径。
  source_cas:
  - 净利润
  - 所有者权益
  - 应付股利
  source_ifrs: sustainable growth rate (Higgins)
  depends_on:
  - roe
  benchmark: 理论上限口径，不等于实际增长潜力（企业常通过融资与并购超速增长）；实际增速持续高于 SGR 须提示融资依赖。
  mpm: false
  provenance: 'research/2026-09-11-25-indicators-article #25'
  tier: professional
  analysis_dimensions:
  - trend
  - value
- metric_code: period_expense_ratio
  name: 期间费用率
  domain: profitability
  definition: 期间费用（销售+管理+研发+财务）占营业收入的比重，衡量费用管控与经营杠杆。
  formula_text: （销售费用 + 管理费用 + 研发费用 + 财务费用）÷ 营业收入
  formula:
    op: div
    args:
    - op: sum
      args:
      - is.selling_exp
      - is.admin_exp
      - is.rnd_exp
      - is.fin_exp
    - is.revenue
  unit: '%'
  time_behavior: period
  caliber: CAS 期间费用四项合计口径；财务费用含利息净支出，与运营口径费用（BP 管理）区分须标注。
  source_cas:
  - 销售费用
  - 管理费用
  - 研发费用
  - 财务费用
  - 营业收入
  source_ifrs: selling / general & administrative / R&D / finance costs
  depends_on: []
  benchmark: '与 BP26 借鉴 #15 登记 gap 一致；拆分费用明细看结构（sales/admin/R&D 各自占比）更有行动意义。'
  mpm: false
  provenance: '借鉴 #15（BP26）v1.1 gap 落地（2026-09-12）'
  tier: core
  analysis_dimensions:
  - trend
  - structure
  - benchmark
- metric_code: volume_growth
  name: 销量增长率
  domain: growth
  definition: 本期销量相对上期销量的增长，量价拆解（规模/价格/结构）中的量因子。
  formula_text: （本期销量 − 上期销量）÷ 上期销量
  formula:
