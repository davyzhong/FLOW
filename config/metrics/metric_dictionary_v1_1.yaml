    - price_prior
  unit: '%'
  time_behavior: period
  caliber: 平均单价 = 收入 ÷ 销量，需分产品量价数据（L2）；财报不可直接取数——绑定按缺失如实标注。
  source_cas: []
  source_ifrs: n/a（经营量纲）
  depends_on: []
  benchmark: 降价促销期与 volume_growth 组合解读收入增长质量；物流行业对应单均收入变动。
  mpm: false
  provenance: '借鉴 #15（BP26）v1.1 gap 落地；C08 量价三因子桥（借鉴 #6）配套'
  tier: professional
  analysis_dimensions:
  - trend
  - structure
