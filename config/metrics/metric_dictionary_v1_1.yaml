  provenance: research/08 §1、§2；research/09 §4.1
  tier: core
  analysis_dimensions:
  - trend
  - dupont
  - benchmark
- metric_code: gross_margin
  name: 毛利率
  domain: profitability
  definition: 每一元营业收入扣除营业成本后的毛利占比，产品「先天赚钱能力」。
  formula_text: （营业收入 − 营业成本）÷ 营业收入 × 100%
  formula:
    op: div
    args:
    - op: sub
      args:
      - is.revenue
      - is.cogs
    - is.revenue
  unit: '%'
  time_behavior: period_flow
  caliber: 无重大分歧。
  source_cas:
  - 营业收入
  - 营业成本
  source_ifrs: gross profit / revenue
  depends_on: []
  benchmark: 毛利率下滑常先于净利率下滑，是竞争加剧的早期信号。
  mpm: false
  provenance: research/08 §1
  tier: core
  analysis_dimensions: &id006
  - trend
  - structure
  - benchmark
  - warning
- metric_code: operating_margin
  name: 营业利润率
  domain: profitability
  definition: 营业利润占营业收入的比例。
  formula_text: 营业利润 ÷ 营业收入 × 100%
  formula:
    op: div
    args:
    - is.operating_profit
    - is.revenue
  unit: '%'
  time_behavior: period_flow
  caliber: 评级机构口径为（营业总收入 − 营业成本 − 税金及附加）÷ 营业总收入，与报表营业利润口径不同，须按口径版本记录。
  source_cas:
  - 营业利润
  - 营业收入
  source_ifrs: operating profit / revenue（IFRS 18 起 operating profit 为法定小计）
  depends_on: []
  benchmark: 物流央企实例 4.9%–6.1%（中国物流集团），行业性低利润率。
  mpm: false
  provenance: research/08 §1、§3；research/09 §4.1
  default_caliber: 营业利润 ÷ 营业收入（报表营业利润口径）
  default_basis: 财会〔2018〕15 号利润表行项目（报表口径为默认）
  alternative_calibers:
  - （营业总收入 − 营业成本 − 税金及附加）÷ 营业总收入（联合资信口径）
  tier: core
  analysis_dimensions: &id003
  - trend
  - structure
  - benchmark
- metric_code: net_margin
  name: 净利率
  aliases:
  - 销售净利率
  domain: profitability
  definition: 净利润占营业收入的比例；杜邦三分解因子之一。
  formula_text: 净利润 ÷ 营业收入 × 100%
  formula:
    op: div
    args:
    - is.net_profit
    - is.revenue
  unit: '%'
  time_behavior: period_flow
  caliber: 可再分解为毛利率、期间费用率、税率（杜邦扩展分解）。
  source_cas:
  - 净利润
  - 营业收入
  source_ifrs: profit for the year / revenue
  depends_on: []
  benchmark: 结合毛利率与费用率联动分析。
  mpm: false
  provenance: research/08 §1、§2
  tier: core
  analysis_dimensions:
  - trend
  - dupont
  - structure
- metric_code: roe
  name: 净资产收益率
  aliases:
  - ROE
  - 权益净利率
  domain: profitability
  definition: 净利润与平均净资产之比，股东视角核心回报指标，杜邦体系核心。
  formula_text: 净利润 ÷ 平均净资产 × 100%
  formula:
    op: div
    args:
    - is.net_profit
    - op: avg
      args:
      - bs.equity
  unit: '%'
  time_behavior: average_balance
  caliber: 平均净资产口径与期末净资产口径并存（评级机构用期末口径：净利润 ÷ 所有者权益）；上市公司另有加权平均口径（证监会规则）。杜邦分解必须使用平均口径。
  decompositions:
  - name: 杜邦三分解
    formula_text: ROE = 销售净利率 × 总资产周转率 × 权益乘数
    factors:
    - net_margin
    - total_asset_turnover
    - equity_multiplier
  source_cas:
  - 净利润
  - 所有者权益合计
  source_ifrs: profit / average equity
  depends_on:
  - net_margin
  - total_asset_turnover
  - equity_multiplier
  benchmark: 物流央企实例 2.2%–9.9%（中国物流集团 2022–2025）。
  mpm: false
  provenance: research/08 §1、§2、§3
  default_caliber: 净利润 ÷ 平均净资产（期初期末平均）；杜邦分解必须用本口径
  default_basis: 国资委《实施细则》与 CPA 教材一致采用平均口径
  alternative_calibers:
  - 期末净资产口径（联合资信）
  - 加权平均口径（证监会 10 号文，上市公司披露）
  tier: core
  analysis_dimensions:
  - trend
  - dupont
  - benchmark
- metric_code: total_assets_return
  name: 总资产报酬率
  aliases:
  - ROA-EBIT口径
  domain: profitability
  definition: 息税前利润与平均资产总额之比，衡量全部资金（自有 + 借入）的回报。
  formula_text: （利润总额 + 利息支出）÷ 平均资产总额 × 100%
  formula:
    op: div
    args:
    - op: add
      args:
      - is.total_profit
      - is.interest_exp
    - op: avg
      args:
      - bs.total_assets
  unit: '%'
  time_behavior: average_balance
  caliber: 另有总资产净利率口径（净利润 ÷ 平均总资产），本版作为变体口径记录，不单列指标。
  source_cas:
  - 利润总额
  - 利息费用
  - 资产总计
  source_ifrs: EBIT / average total assets
  depends_on: []
  benchmark: 物流央企实例 2.9%–3.8%（中国物流集团）。
  mpm: false
  provenance: research/08 §1、§3
  tier: professional
  analysis_dimensions: *id003
  alternative_calibers:
  - ROA 净利润口径：净利润 ÷ 总资产（期末或平均分母均有流派；科普与投研常用，与库内联合资信总资产报酬率口径对比时须先对齐分子分母）
- metric_code: roce
  name: 总资本收益率
  aliases:
  - ROCE
  domain: profitability
  definition: 净利润加费用化利息与投入资本（权益 + 全部债务）之比。
  formula_text: （净利润 + 费用化利息支出）÷（所有者权益 + 长期债务 + 短期债务）× 100%
  formula:
    op: div
    args:
    - op: add
      args:
      - is.net_profit
      - is.interest_exp
    - op: add
      args:
      - bs.equity
      - bs.long_debt
      - bs.short_debt
  unit: '%'
  time_behavior: point_balance
  caliber: 联合资信评级口径；国际 ROCE 常用 EBIT ÷ 资本占用，属不同口径版本。
  source_cas:
  - 净利润
  - 利息费用
  - 所有者权益合计
  - 长期借款
  - 短期借款
  source_ifrs: return on capital employed
  depends_on: []
  benchmark: 结合融资成本判断资本回报是否覆盖代价。
  mpm: false
  provenance: research/08 §3
  default_caliber: (净利润 + 费用化利息支出) ÷ (所有者权益 + 长期债务 + 短期债务)
  default_basis: 联合资信评级附件口径（中国市场主流评级口径）
  alternative_calibers:
  - EBIT ÷ 资本占用（国际口径）
  tier: professional
  analysis_dimensions: *id003
- metric_code: cost_expense_profit_ratio
  name: 成本费用利润率
  domain: profitability
  definition: 利润总额与成本费用总额之比，衡量投入产出的费用效率。
  formula_text: 利润总额 ÷（营业成本 + 销售费用 + 管理费用 + 财务费用）× 100%
  formula:
    op: div
    args:
    - is.total_profit
    - op: add
      args:
      - is.cogs
      - is.selling_exp
      - is.admin_exp
      - is.fin_exp
  unit: '%'
  time_behavior: period_flow
  caliber: 成本费用总额是否含税金及附加、研发费用，按口径版本记录。
  source_cas:
  - 利润总额
  - 营业成本
  - 销售费用
  - 管理费用
  - 财务费用
  source_ifrs: profit before tax / total costs and expenses
  depends_on: []
  benchmark: 结合费用结构分析。
  mpm: false
  provenance: research/08 §1
  default_caliber: 成本费用总额 = 营业成本 + 税金及附加 + 销售费用 + 管理费用 + 研发费用 + 财务费用（全口径）
  default_basis: 国资委《实施细则》成本费用利润率口径
  alternative_calibers:
  - 不含税金及附加与研发费用的窄口径
  tier: professional
  analysis_dimensions: *id003
- metric_code: equity_multiplier
  name: 权益乘数
  domain: profitability
  definition: 平均总资产相当于平均净资产的倍数，财务杠杆水平；杜邦三分解因子之一。
  formula_text: 平均总资产 ÷ 平均净资产
  formula:
    op: div
    args:
    - op: avg
      args:
      - bs.total_assets
    - op: avg
      args:
      - bs.equity
  unit: 倍
  time_behavior: average_balance
  caliber: 与资产负债率同向变动；杜邦分解必须使用平均口径。
  source_cas:
  - 资产总计
  - 所有者权益合计
  source_ifrs: average total assets / average equity
  depends_on: []
  benchmark: 过高须结合利息保障倍数与流动比率交叉验证，避免 ROE 虚高。
  mpm: false
  provenance: research/08 §2
  tier: professional
  analysis_dimensions:
  - structure
  - dupont
  - warning
- metric_code: ebitda
  name: EBITDA
  aliases:
  - 息税折旧摊销前利润
  domain: profitability
  definition: 利润总额加回利息费用与折旧摊销，剔除资本结构与会计估计影响的盈利口径。
  formula_text: 利润总额 + 利息费用 + 折旧与摊销
  formula:
    op: add
    args:
    - is.total_profit
    - is.interest_exp
    - is.dep_amort
  unit: 元
  time_behavior: period_flow
  caliber: 间接法口径；是否含投资收益、公允价值变动等须按口径版本记录；IFRS 未定义 EBITDA。EBITDA 不是现金，禁止与经营活动现金流量净额混称（C03）。
  source_cas:
  - 利润总额
  - 利息费用
  - 折旧与摊销
  source_ifrs: earnings before interest, taxes, depreciation and amortisation（非 IFRS
    定义指标）
  depends_on: []
  benchmark: 物流央企实例 47–82 亿元（中国物流集团）。
  mpm: false
  mpm_review:
    determination: candidate
    verified: false
    condition: 仅当企业在公开财务报表中实际列报 EBITDA 时即属 IFRS 18 MPM，须调节至最接近法定小计（利润总额）并在单一附注披露；本库不静态授予监管标签。
    basis: IFRS 18（IASB，2024-05 发布，2027-01-01 起生效）B116–B118；EY/KPMG 实务指引（提前参照）。
  reconciliation: 以利润总额（profit before tax）为最直接可比法定小计，调节项为利息费用、折旧与摊销。
  provenance: research/08 §3；research/09 §2
  default_caliber: 利润总额 + 计入财务费用的利息支出 + 固定资产折旧 + 无形资产摊销 + 长期待摊费用摊销（间接法）
  default_basis: 中国评级与信贷市场通行间接法（联合资信附件）
  alternative_calibers:
  - 含投资收益与公允价值变动的宽口径（须标注）
  tier: professional
  analysis_dimensions: *id003
- metric_code: adjusted_ebitda
  name: 调整后 EBITDA
  aliases:
  - Adjusted EBITDA
  domain: profitability
  definition: 在 EBITDA 基础上进一步剔除减值、处置损益、权益法投资收益等非经常/非现金项目的管理层口径指标。
  formula_text: EBITDA ± 减值损失/转回 ± 处置组重计量 ∓ 权益法投资收益等调整项
  formula:
    op: identity
    args:
    - ebitda
    note: 调整项清单为口径版本的核心内容，须逐项列明
  unit: 元
  time_behavior: period_flow
  caliber: IFRS 未定义，企业间口径不可直接比较；调整后利润不得与法定利润（利润总额/净利润）混同，展示必须带"调整后 / Non-GAAP"标签并引用调节表（C18）；若于公开财报列报则属
    IFRS 18 MPM，须单一附注集中披露计算方式与调节表（EY/KPMG 指引）。
  source_cas:
  - 利润总额
  - 利息费用
  - 折旧与摊销
  - 资产减值损失
  - 投资收益
  source_ifrs: adjusted EBITDA as MPM candidate (IFRS 18.B116–B117；KPMG illustrative
    disclosures)
  depends_on:
  - ebitda
  benchmark: 仅作管理层口径展示，禁止跨企业直接对比。
  mpm: false
  mpm_review:
    determination: candidate
    verified: false
    condition: 仅当于公开财报列报时属 IFRS 18 MPM（须调节与单一附注披露）；本库不静态授予监管标签。
    basis: IFRS 18（IASB，2024-05 发布，2027-01-01 起生效）B116–B118；KPMG 示例披露（提前参照）。
  reconciliation: 调节至持续经营利润：持续经营利润 + 所得税 + 净财务费用 + 折旧 + 摊销 ± 减值及处置调整 ∓ 权益法收益（KPMG
    示例结构）。
  provenance: research/09 §2、§3
  tier: professional
  analysis_dimensions: *id003
- metric_code: ebitda_margin
  name: EBITDA 利润率
  domain: profitability
  definition: EBITDA 占营业收入的比例。
  formula_text: EBITDA ÷ 营业总收入 × 100%
  formula:
    op: div
    args:
    - ebitda
