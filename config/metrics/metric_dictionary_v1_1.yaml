dictionary_id: flow.metric_dictionary.v1
status: effective
decision_ref: D047；2026-09-12 用户指令：内部指标库扩充与分层（tier + analysis_dimensions + 9 新增 +
  口径变体，D047）
created: 2026-09-05
standards_scope:
- CAS
- IFRS
domains:
  solvency: 偿债能力
  operation: 营运能力
  profitability: 盈利能力
  growth: 发展能力
  cashflow: 现金流
  scale: 规模（物流行业集专用）
  value: 价值创造
report_items:
  bs.cash:
    cas: 货币资金
    ifrs: cash and cash equivalents (IAS 1 / IAS 7)
  bs.notes_receivable:
    cas: 应收票据
    ifrs: notes receivable
  bs.ar:
    cas: 应收账款
    ifrs: trade receivables (IFRS 15 / IFRS 9)
  bs.inventory:
    cas: 存货
    ifrs: inventories (IAS 2)
  bs.current_assets:
    cas: 流动资产合计
    ifrs: total current assets (IAS 1)
  bs.fixed_assets:
    cas: 固定资产
    ifrs: property, plant and equipment (IAS 16)
  bs.total_assets:
    cas: 资产总计
    ifrs: total assets (IAS 1)
  bs.short_debt:
    cas: 短期借款及一年内到期的非流动负债等短期债务
    ifrs: current borrowings
  bs.ap:
    cas: 应付账款
    ifrs: trade payables
  bs.current_liab:
    cas: 流动负债合计
    ifrs: total current liabilities (IAS 1)
  bs.long_debt:
    cas: 长期借款及应付债券等长期债务
    ifrs: non-current borrowings
  bs.total_liab:
    cas: 负债合计
    ifrs: total liabilities (IAS 1)
  bs.equity:
    cas: 所有者权益合计
    ifrs: total equity (IAS 1)
  is.revenue:
    cas: 营业收入
    ifrs: revenue (IFRS 15)
  is.cogs:
    cas: 营业成本
    ifrs: cost of sales
  is.taxes_surcharges:
    cas: 税金及附加
    ifrs: taxes and surcharges (CAS 特有行项目)
  is.selling_exp:
    cas: 销售费用
    ifrs: selling and distribution expenses
  is.admin_exp:
    cas: 管理费用
    ifrs: administrative expenses
  is.fin_exp:
    cas: 财务费用
    ifrs: finance costs, net (IAS 1 / IFRS 18)
  is.interest_exp:
    cas: 利息费用（费用化）
    ifrs: interest expense (effective interest method, IFRS 9)
  is.operating_profit:
    cas: 营业利润
    ifrs: operating profit (IFRS 18 法定小计)
  is.total_profit:
    cas: 利润总额
    ifrs: profit before tax
  is.income_tax:
    cas: 所得税费用
    ifrs: income tax expense (IAS 12)
  is.net_profit:
    cas: 净利润
    ifrs: profit for the year
  is.dep_amort:
    cas: 折旧与摊销（现金流量表补充资料）
    ifrs: depreciation and amortisation (IAS 7)
  cf.ocf:
    cas: 经营活动产生的现金流量净额
    ifrs: net cash from operating activities (IAS 7)
  cf.cash_from_sales:
    cas: 销售商品、提供劳务收到的现金
    ifrs: cash receipts from customers (IAS 7)
  cf.capex:
    cas: 购建固定资产、无形资产和其他长期资产支付的现金
    ifrs: purchase of PP&E and intangibles (IAS 7)
metrics_general:
- metric_code: current_ratio
  name: 流动比率
  domain: solvency
  definition: 流动资产对流动负债的保障程度，衡量短期偿债能力。
  formula_text: 流动资产 ÷ 流动负债
  formula:
    op: div
    args:
    - bs.current_assets
    - bs.current_liab
  unit: 倍
  time_behavior: point_balance
  caliber: 教科书标准口径，无重大分歧。
  source_cas:
  - 流动资产合计
  - 流动负债合计
  source_ifrs: total current assets / total current liabilities (IAS 1)
  depends_on: []
  benchmark: 经验参考约 2；过高可能资金闲置；行业差异大。
  mpm: false
  provenance: research/08 §1
  tier: core
  analysis_dimensions: &id001
  - trend
  - warning
  - benchmark
- metric_code: quick_ratio
  name: 速动比率
  domain: solvency
  definition: 剔除存货后的流动资产对流动负债的保障程度，更严格的短期偿债口径。
  formula_text: （流动资产 − 存货）÷ 流动负债
  formula:
    op: div
    args:
    - op: sub
      args:
      - bs.current_assets
      - bs.inventory
    - bs.current_liab
  unit: 倍
  time_behavior: point_balance
  caliber: 部分口径再剔除预付账款等其他流动资产，须按口径版本记录。
  source_cas:
  - 流动资产合计
  - 存货
  - 流动负债合计
  source_ifrs: (current assets − inventories) / current liabilities
  depends_on: []
  benchmark: 经验参考约 1。
  mpm: false
  provenance: research/08 §1
  tier: core
  analysis_dimensions: *id001
- metric_code: cash_ratio
  name: 现金比率
  domain: solvency
  definition: 货币资金对流动负债的直接覆盖，最保守的即时支付能力口径。
  formula_text: 货币资金 ÷ 流动负债
  formula:
    op: div
    args:
    - bs.cash
    - bs.current_liab
  unit: 倍
  time_behavior: point_balance
  caliber: 部分口径含交易性金融资产（现金等价物），须标注。
  source_cas:
  - 货币资金
  - 流动负债合计
  source_ifrs: cash and cash equivalents / current liabilities
  depends_on: []
  benchmark: 无统一经验值，结合行业与账期结构判断。
  mpm: false
  provenance: research/08 §1
  default_caliber: 分子仅取货币资金（最保守口径）
  default_basis: CPA《财务成本管理》标准定义
  alternative_calibers:
  - 分子含交易性金融资产（现金等价物扩展口径）
  tier: core
  analysis_dimensions: *id001
- metric_code: ocf_current_liab_ratio
  name: 现金流量比率
  aliases:
  - 经营现金流动负债比
  domain: solvency
  definition: 经营活动现金流量净额对流动负债的保障程度，现金视角的短期偿债能力。
  formula_text: 经营活动现金流量净额 ÷ 流动负债
  formula:
    op: div
    args:
    - cf.ocf
    - bs.current_liab
  unit: 倍
  time_behavior: period_flow
  caliber: 分子为期间流量、分母为时点余额；评级机构口径同（经营现金流动负债比，%）。
  source_cas:
  - 经营活动产生的现金流量净额
  - 流动负债合计
  source_ifrs: net cash from operating activities / current liabilities (IAS 7 / IAS
    1)
  depends_on: []
  benchmark: 结合现金流稳定性判断。
  mpm: false
  provenance: research/08 §1、§3
  tier: core
  analysis_dimensions: *id001
- metric_code: debt_asset_ratio
  name: 资产负债率
  domain: solvency
  definition: 总资产中由债务形成的比例，长期偿债能力总览。
  formula_text: 负债总额 ÷ 资产总额 × 100%
  formula:
    op: div
    args:
    - bs.total_liab
    - bs.total_assets
  unit: '%'
  time_behavior: point_balance
  caliber: 无重大分歧。
  source_cas:
  - 负债合计
  - 资产总计
  source_ifrs: total liabilities / total assets (IAS 1)
  depends_on: []
  benchmark: 参考 40%–60%，行业差异大，须与同行对比。物流央企口径约 47%–57%（中国物流集团）。
  mpm: false
  provenance: research/08 §1、§3；research/09 §4.1
  tier: core
  analysis_dimensions: *id001
- metric_code: debt_equity_ratio
  name: 产权比率
  domain: solvency
  definition: 负债总额与所有者权益之比，反映资本结构。
  formula_text: 负债总额 ÷ 所有者权益
  formula:
    op: div
    args:
    - bs.total_liab
    - bs.equity
  unit: 倍
  time_behavior: point_balance
  caliber: 与资产负债率互为变形（产权比率 = 资产负债率 ÷ (1 − 资产负债率)）。
  source_cas:
  - 负债合计
  - 所有者权益合计
  source_ifrs: total liabilities / total equity
  depends_on: []
  benchmark: 结合行业资本结构判断。
  mpm: false
  provenance: research/08 §1
  tier: professional
  analysis_dimensions: *id001
  alternative_calibers:
  - 有息债务口径：有息负债 ÷ 股东权益（剔除无息经营性负债，更严格反映财务杠杆；与全额负债口径的产权比率差异须标注）
- metric_code: interest_coverage
  name: 利息保障倍数
  aliases:
  - 已获利息倍数
  domain: solvency
  definition: 息税前利润对利息费用的覆盖能力。
  formula_text: （利润总额 + 利息费用）÷ 利息费用
  formula:
    op: div
    args:
    - op: add
      args:
      - is.total_profit
      - is.interest_exp
    - is.interest_exp
  unit: 倍
  time_behavior: period_flow
  caliber: 分子即 EBIT 的间接算法；利息费用口径区分费用化/资本化时须标注。
  source_cas:
  - 利润总额
  - 利息费用
  source_ifrs: EBIT / interest expense
  depends_on: []
  benchmark: '>3 较安全。'
  mpm: false
  provenance: research/08 §1
  default_caliber: 分子 EBIT = 利润总额 + 费用化利息费用；分母 = 费用化 + 资本化全部利息
  default_basis: CPA《财务成本管理》2025（费用化/资本化口径区分）
  alternative_calibers:
  - 分母仅费用化利息（简化口径）
  tier: core
  analysis_dimensions: *id001
- metric_code: ebitda_interest_coverage
  name: EBITDA 利息倍数
  domain: solvency
  definition: EBITDA 对利息支出的覆盖能力，评级机构长期偿债核心口径。
  formula_text: EBITDA ÷ 利息支出
  formula:
    op: div
    args:
    - ebitda
    - is.interest_exp
  unit: 倍
  time_behavior: period_flow
  caliber: 联合资信评级口径；利息支出含费用化与资本化时须标注。
  source_cas:
  - 利润总额
  - 利息费用
  - 折旧与摊销
  source_ifrs: EBITDA / interest expense
  depends_on:
  - ebitda
  benchmark: 物流央企实例 5.45–9.31 倍（中国物流集团 2022–2025）。
  mpm: false
  provenance: research/08 §3；research/09 §4.1
  default_caliber: 利息支出 = 费用化 + 资本化全部利息
  default_basis: 联合资信评级口径（全口径利息更审慎）
  alternative_calibers:
  - 仅费用化利息
  tier: professional
  analysis_dimensions:
  - warning
  - cash_link
- metric_code: total_debt_capitalization
  name: 全部债务资本化比率
  domain: solvency
  definition: 全部债务占全部债务与所有者权益之和的比例，评级机构债务结构口径。
  formula_text: 全部债务 ÷（长期债务 + 短期债务 + 所有者权益）× 100%
  formula:
    op: div
    args:
    - op: add
      args:
      - bs.short_debt
      - bs.long_debt
    - op: add
      args:
      - bs.short_debt
      - bs.long_debt
      - bs.equity
  unit: '%'
  time_behavior: point_balance
  caliber: 全部债务 = 短期债务 + 长期债务（联合资信口径）；债务边界（是否含应付票据、租赁负债）须按口径版本记录。
  source_cas:
  - 短期借款
  - 长期借款
  - 应付债券
  - 所有者权益合计
  source_ifrs: total debt / (total debt + equity)；对照 KPMG 净债务/调整后权益管理口径
  depends_on: []
  benchmark: 物流央企实例 33%–44%（中国物流集团）。
  mpm: false
  provenance: research/08 §3；research/09 §2
  default_caliber: 全部债务 = 短期借款 + 一年内到期非流动负债 + 长期借款 + 应付债券；不含应付票据与租赁负债
  default_basis: 联合资信评级附件口径（带息债务不含经营性应付款项）
  alternative_calibers:
  - 含租赁负债（新租赁准则口径，标注后可用）
  tier: professional
  analysis_dimensions:
  - structure
  - warning
- metric_code: long_debt_capitalization
  name: 长期债务资本化比率
  domain: solvency
  definition: 长期债务占长期资本（长期债务 + 所有者权益）的比例。
  formula_text: 长期债务 ÷（长期债务 + 所有者权益）× 100%
  formula:
    op: div
    args:
    - bs.long_debt
    - op: add
      args:
      - bs.long_debt
      - bs.equity
  unit: '%'
  time_behavior: point_balance
  caliber: 联合资信评级口径。
  source_cas:
  - 长期借款
  - 应付债券
  - 所有者权益合计
  source_ifrs: non-current debt / (non-current debt + equity)
  depends_on: []
  benchmark: 结合债务期限结构判断。
  mpm: false
  provenance: research/08 §3
  tier: professional
  analysis_dimensions:
  - structure
  - warning
- metric_code: ar_turnover
  name: 应收账款周转率
  domain: operation
  definition: 营业收入与平均应收账款之比，衡量回款效率。
  formula_text: 营业收入 ÷ 平均应收账款
  formula:
    op: div
    args:
    - is.revenue
    - op: avg
      args:
      - bs.ar
  unit: 次
  time_behavior: average_balance
  caliber: 评级机构扩展口径（销售债权周转次数）分母含应收票据与应收款项融资；两口径并存。
  source_cas:
  - 营业收入
  - 应收账款
  source_ifrs: revenue / average trade receivables
  depends_on: []
  benchmark: 越高回款越快；应收增速持续超过营收增速为回款变慢信号。
  mpm: false
  provenance: research/08 §1、§3；research/09 §4.4
  default_caliber: 分母 = 平均应收账款（不含应收票据）
  default_basis: CPA 教材标准口径（周转率族教科书定义）
  alternative_calibers:
  - 销售债权周转次数：分母含应收票据与应收款项融资（联合资信扩展口径）
  tier: core
  analysis_dimensions: &id002
  - trend
  - benchmark
- metric_code: dso_days
  name: 应收账款周转天数
  aliases:
  - DSO
  - 平均收账期
  domain: operation
  definition: 应收账款平均回收所需天数。
  formula_text: 360 ÷ 应收账款周转率
  formula:
    op: div
    args:
    - 360
    - ar_turnover
  unit: 天
  time_behavior: average_balance
  caliber: 教科书用 360 天；部分机构与 FLOW 物流集（dso）用 365 天 / T12 收入口径，属不同口径版本。
  source_cas:
  - 营业收入
  - 应收账款
  source_ifrs: days sales outstanding
  depends_on:
  - ar_turnover
  benchmark: 结合合同账期判断；连续上升为预警。
  mpm: false
  provenance: research/08 §1
  default_caliber: 360 ÷ 应收账款周转率（360 天基准）
  default_basis: CPA 教材与国资委细则惯例
  alternative_calibers:
  - 365 天口径
  - T12 收入滚动口径（FLOW 物流集 dso）
  tier: core
  analysis_dimensions: *id002
- metric_code: inventory_turnover
  name: 存货周转率
  domain: operation
  definition: 营业成本与平均存货之比，衡量库存管理与变现效率。
  formula_text: 营业成本 ÷ 平均存货
  formula:
    op: div
    args:
    - is.cogs
    - op: avg
      args:
      - bs.inventory
  unit: 次
  time_behavior: average_balance
  caliber: 评级机构口径分母用平均存货净额。
  source_cas:
  - 营业成本
  - 存货
  source_ifrs: cost of sales / average inventories (IAS 2)
  depends_on: []
  benchmark: 越高周转越快；过低警惕积压跌价。
  mpm: false
  provenance: research/08 §1、§3
  tier: core
  analysis_dimensions: *id002
- metric_code: dio_days
  name: 存货周转天数
  aliases:
  - DIO
  domain: operation
  definition: 存货平均持有天数。
  formula_text: 360 ÷ 存货周转率
  formula:
    op: div
    args:
    - 360
    - inventory_turnover
  unit: 天
  time_behavior: average_balance
  caliber: 同 dso_days 的天数口径规则。
  source_cas:
  - 营业成本
  - 存货
  source_ifrs: days inventory outstanding
  depends_on:
  - inventory_turnover
  benchmark: 结合行业（物流企业存货极轻，周转 25 次以上，见中国物流集团）。
  mpm: false
  provenance: research/08 §1；research/09 §4.1
  tier: core
  analysis_dimensions: *id002
- metric_code: ap_turnover
  name: 应付账款周转率
  domain: operation
  definition: 采购/成本与平均应付账款之比，衡量对供应商账期的占用。
  formula_text: 营业成本 ÷ 平均应付账款
  formula:
    op: div
    args:
    - is.cogs
    - op: avg
      args:
      - bs.ap
  unit: 次
  time_behavior: average_balance
  caliber: 分子可用营业成本或采购成本，两种口径并存，须标注。
  source_cas:
  - 营业成本
  - 应付账款
  source_ifrs: purchases / average trade payables
  depends_on: []
  benchmark: 与 DSO/DIO 联看净营业周期。
  mpm: false
  provenance: research/08 §1
  default_caliber: 分子 = 营业成本
  default_basis: CPA 教材标准口径（与存货周转分子一致）
  alternative_calibers:
  - 分子 = 采购成本（联合资信扩展口径）
  tier: core
  analysis_dimensions: *id002
- metric_code: dpo_days
  name: 应付账款周转天数
  aliases:
  - DPO
  domain: operation
  definition: 应付账款平均支付天数。
  formula_text: 360 ÷ 应付账款周转率
  formula:
    op: div
    args:
    - 360
    - ap_turnover
  unit: 天
  time_behavior: average_balance
  caliber: 同 dso_days 的天数口径规则。
  source_cas:
  - 营业成本
  - 应付账款
  source_ifrs: days payable outstanding
  depends_on:
  - ap_turnover
  benchmark: 过长可能损害供应商关系。
  mpm: false
  provenance: research/08 §1
  tier: core
  analysis_dimensions: *id002
- metric_code: current_asset_turnover
  name: 流动资产周转率
  domain: operation
  definition: 营业收入与平均流动资产之比。
  formula_text: 营业收入 ÷ 平均流动资产
  formula:
    op: div
    args:
    - is.revenue
    - op: avg
      args:
      - bs.current_assets
  unit: 次
  time_behavior: average_balance
  caliber: 教科书标准口径。
  source_cas:
  - 营业收入
  - 流动资产合计
  source_ifrs: revenue / average current assets
  depends_on: []
  benchmark: 流动资产增长快于收入时该指标下降。
  mpm: false
  provenance: research/08 §1；research/09 §4.3
  tier: professional
  analysis_dimensions: *id002
- metric_code: fixed_asset_turnover
  name: 固定资产周转率
  domain: operation
  definition: 营业收入与平均固定资产之比，衡量固定资产投入产出。
