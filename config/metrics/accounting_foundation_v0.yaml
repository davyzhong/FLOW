# ============================================================
# 准则登记册（与本数据集直接相关的条目；全量 42 项具体准则为后续步骤）
# ============================================================
standards:
  - {id: CAS-BASIC, name: 企业会计准则——基本准则, issuer: 财政部, note: 六大会计要素、确认计量原则、会计信息质量要求}
  - {id: CAS-APPENDIX-2006, name: 企业会计准则应用指南（2006）附录：会计科目和主要账务处理, issuer: 财政部, note: 156 科目六大类；accounts 主表来源}
  - {id: CAS-COMPILATION-2024, name: 企业会计准则应用指南汇编（2024）, issuer: 财政部, note: 171 科目；演进依据见致同研究梳理}
  - {id: CAS-14, name: 企业会计准则第 14 号——收入（2017 修订）, note: 五步法收入确认；对照 IFRS 15}
  - {id: CAS-21, name: 企业会计准则第 21 号——租赁（2018 修订）, note: 使用权资产 / 租赁负债；对照 IFRS 16}
  - {id: CAS-22, name: 企业会计准则第 22 号——金融工具确认和计量（2017 修订）, note: 预期信用损失模型；对照 IFRS 9}
  - {id: CAS-9, name: 企业会计准则第 9 号——职工薪酬, note: 应付职工薪酬核算}
  - {id: CAS-4, name: 企业会计准则第 4 号——固定资产, note: 固定资产确认与折旧}
  - {id: IFRS-18, name: IFRS 18 Presentation and Disclosures in Financial Statements, issuer: IASB, note: 2027 生效；经营利润法定小计与 MPM 披露（research/09 §3）}
  - {id: IAS-1, name: IAS 1 Presentation of Financial Statements, issuer: IASB, note: 报表行项目与小计}
  - {id: IAS-7, name: IAS 7 Statement of Cash Flows, issuer: IASB, note: 现金流量表口径}

# ============================================================
# 分录模板（物流供应链业务典型场景，查阅级 + 取数映射用途）
# 字段：lines 为借贷行；amount_rule 说明金额来源；related_metrics 链接指标库
# ============================================================
entry_templates:

  - template_id: ET01_service_revenue_credit
    scenario: 提供运输/仓储服务，月末按账单确认收入（赊销）
    business_context: 物流核心收入确认；战略客户月结账期场景
    lines:
      - {direction: 借, account: "1122 应收账款", amount_rule: 价税合计账单金额}
      - {direction: 贷, account: "6001 主营业务收入", amount_rule: 不含税服务费}
      - {direction: 贷, account: "2221 应交税费——应交增值税（销项税额）", amount_rule: 适用税率计算}
    standard_ref: CAS-14 / CAS-APPENDIX-2006「1122」「6001」
    related_metrics: [revenue, ar_balance, dso, ar_turnover]

  - template_id: ET02_service_revenue_cash
    scenario: 现结服务收入
    lines:
      - {direction: 借, account: "1002 银行存款", amount_rule: 实收价税合计}
      - {direction: 贷, account: "6001 主营业务收入", amount_rule: 不含税金额}
      - {direction: 贷, account: "2221 应交税费——应交增值税（销项税额）", amount_rule: 适用税率计算}
    standard_ref: CAS-14
    related_metrics: [revenue, cash_revenue_ratio]

  - template_id: ET03_customer_collection
    scenario: 收到客户回款
    lines:
      - {direction: 借, account: "1002 银行存款", amount_rule: 实际到账金额}
      - {direction: 贷, account: "1122 应收账款", amount_rule: 核销对应账单}
    standard_ref: CAS-APPENDIX-2006「1122」
    related_metrics: [collection_rate, ar_balance, dso, ocf_net_profit_ratio]

  - template_id: ET04_notes_receivable
    scenario: 客户以商业汇票结算
    lines:
      - {direction: 借, account: "1121 应收票据", amount_rule: 票面金额}
      - {direction: 贷, account: "1122 应收账款", amount_rule: 票面金额}
    standard_ref: CAS-APPENDIX-2006「1121」
    related_metrics: [ar_balance, ar_turnover]

  - template_id: ET05_bad_debt_provision
    scenario: 期末按预期信用损失计提坏账准备
    lines:
      - {direction: 借, account: "6702 信用减值损失", amount_rule: 预期信用损失模型计算（账龄矩阵等）}
      - {direction: 贷, account: "1231 坏账准备", amount_rule: 同左}
    standard_ref: CAS-22 / IFRS 9 预期信用损失模型
    related_metrics: [ar_balance, dso]
    note: 旧准则口径借记「6701 资产减值损失」；新金融工具准则后应收款项减值计入信用减值损失。

  - template_id: ET06_outsource_capacity
    scenario: 外协运力成本入账（运输外包）
    lines:
      - {direction: 借, account: "6401 主营业务成本", amount_rule: 不含税外协费用}
      - {direction: 借, account: "2221 应交税费——应交增值税（进项税额）", amount_rule: 专用发票税额}
      - {direction: 贷, account: "2202 应付账款", amount_rule: 价税合计}
    standard_ref: CAS-APPENDIX-2006「6401」「2202」
    related_metrics: [direct_cost, fulfillment_cost_rate, ap_turnover]

  - template_id: ET07_fuel_toll
    scenario: 支付燃油费、路桥费等直接运营成本
    lines:
      - {direction: 借, account: "6401 主营业务成本", amount_rule: 不含税金额}
      - {direction: 借, account: "2221 应交税费——应交增值税（进项税额）", amount_rule: 可抵扣税额}
      - {direction: 贷, account: "1002 银行存款", amount_rule: 实付金额}
    standard_ref: CAS-APPENDIX-2006「6401」
    related_metrics: [direct_cost, cost_per_order]

  - template_id: ET08_payroll_accrual
    scenario: 计提司机/操作人员薪酬
    lines:
      - {direction: 借, account: "6401 主营业务成本", amount_rule: 直接履约人员薪酬}
      - {direction: 借, account: "6602 管理费用", amount_rule: 管理人员薪酬}
      - {direction: 贷, account: "2211 应付职工薪酬", amount_rule: 应发合计}
    standard_ref: CAS-9
    related_metrics: [direct_cost, fulfillment_cost_rate]
    note: 也可先经「5201 劳务成本」归集再结转主营业务成本，按企业成本核算口径选择。

  - template_id: ET09_payroll_payment
    scenario: 发放薪酬
    lines:
      - {direction: 借, account: "2211 应付职工薪酬", amount_rule: 实发及代扣合计}
      - {direction: 贷, account: "1002 银行存款", amount_rule: 实发金额}
      - {direction: 贷, account: "2221 应交税费——应交个人所得税", amount_rule: 代扣个税}
    standard_ref: CAS-9
    related_metrics: []

  - template_id: ET10_vehicle_purchase
    scenario: 购置运输车辆/仓储设备
    lines:
      - {direction: 借, account: "1601 固定资产", amount_rule: 不含税购置成本及达到可使用状态前必要支出}
      - {direction: 借, account: "2221 应交税费——应交增值税（进项税额）", amount_rule: 可抵扣税额}
      - {direction: 贷, account: "1002 银行存款 / 2701 长期应付款", amount_rule: 支付方式}
    standard_ref: CAS-4
    related_metrics: [fixed_asset_turnover, free_cash_flow]

  - template_id: ET11_depreciation
    scenario: 计提车辆/设备折旧
    lines:
      - {direction: 借, account: "6401 主营业务成本", amount_rule: 直接履约资产折旧}
      - {direction: 借, account: "6602 管理费用", amount_rule: 管理用资产折旧}
      - {direction: 贷, account: "1602 累计折旧", amount_rule: 月度折旧额}
    standard_ref: CAS-4
    related_metrics: [ebitda, direct_cost]

  - template_id: ET12_lease_new_standard
    scenario: 仓库/场地租赁（新租赁准则承租人）
    lines:
      - {direction: 借, account: "1501a 使用权资产", amount_rule: 租赁付款额现值 + 初始直接费用}
      - {direction: 贷, account: "2701a 租赁负债", amount_rule: 租赁付款额现值}
    standard_ref: CAS-21（2018 修订）/ IFRS 16
    related_metrics: [debt_asset_ratio, ebitda]
    note: 后续计量：计提使用权资产折旧（借成本/费用，贷累计折旧）；确认租赁负债利息（借财务费用，贷租赁负债）；支付租金（借租赁负债，贷银行存款）。

  - template_id: ET13_tax_surcharge
    scenario: 计提税金及附加
    lines:
      - {direction: 借, account: "6403 税金及附加", amount_rule: 城建税、教育费附加等}
      - {direction: 贷, account: "2221 应交税费", amount_rule: 同左}
    standard_ref: 财会〔2016〕22号
    related_metrics: [operating_margin]

  - template_id: ET14_vat_payment
    scenario: 缴纳增值税
    lines:
      - {direction: 借, account: "2221 应交税费——未交增值税", amount_rule: 申报应纳税额}
      - {direction: 贷, account: "1002 银行存款", amount_rule: 实缴金额}
    standard_ref: 财会〔2016〕22号
    related_metrics: []

  - template_id: ET15_income_tax
    scenario: 计提企业所得税
    lines:
      - {direction: 借, account: "6801 所得税费用", amount_rule: 当期所得税费用}
      - {direction: 贷, account: "2221 应交税费——应交企业所得税", amount_rule: 同左}
    standard_ref: CAS-18 所得税
    related_metrics: [net_margin]

  - template_id: ET16_short_term_loan
    scenario: 取得短期借款 / 计提利息
    lines:
      - {direction: 借, account: "1002 银行存款", amount_rule: 借款本金}
      - {direction: 贷, account: "2001 短期借款", amount_rule: 借款本金}
      - {direction: 借, account: "6603 财务费用", amount_rule: 计提利息}
      - {direction: 贷, account: "2231 应付利息", amount_rule: 计提利息}
    standard_ref: CAS-APPENDIX-2006「2001」「6603」
    related_metrics: [debt_asset_ratio, interest_coverage, cash_short_debt_ratio]

  - template_id: ET17_period_close
    scenario: 月末损益结转
    lines:
      - {direction: 借, account: "6001 主营业务收入等收入类科目", amount_rule: 本期贷方发生额}
      - {direction: 贷, account: "4103 本年利润", amount_rule: 收入合计}
      - {direction: 借, account: "4103 本年利润", amount_rule: 成本费用合计}
      - {direction: 贷, account: "6401/6601/6602/6603 等成本费用类科目", amount_rule: 本期借方发生额}
    standard_ref: CAS-APPENDIX-2006「4103」
    related_metrics: [net_margin, operating_margin]
