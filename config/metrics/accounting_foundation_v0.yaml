# 状态：draft，待正式规格批准后迁移为工程契约
# 决策依据：D040（2026-09-05 用户确认：查阅级 + 取数映射，CAS + IFRS 对照）
# 科目表来源：《企业会计准则应用指南》（2006）附录「会计科目和主要账务处理」，维基文库全文（research/07 §2）
# 2024 演进来源：致同研究对《企业会计准则应用指南汇编 2024》（171 科目）的梳理（research/07 §3）
#
# 字段约定：
#   code          科目编号（2006 附录编号；2024 新增科目以 source_note 标注依据）
#   balance_side  余额方向：借 / 贷 / 双向；备抵与减项科目单独标注
#   status        current 现行 / superseded 已被后续准则修订 / added_2024 汇编新增
#   standard_ref  准则出处

dataset_id: flow.accounting_foundation.v0-draft
status: draft
decision_ref: D040
created: 2026-09-05
standards_scope: [CAS, IFRS]
known_gaps:
  - 2024 汇编共 171 个科目，本版已核实并收录 5 个新增科目编号（1481/1482/2245/6115/6117）与 2 个新准则科目（使用权资产、租赁负债，编号以汇编原文为准，暂用实务常用编号标注）；其余新增科目待获取《应用指南汇编 2024》原文后补齐。
  - 准则登记册（standards）暂收录与本数据集直接相关的 CAS/IFRS 条目，42 项具体准则全量登记为后续步骤。

