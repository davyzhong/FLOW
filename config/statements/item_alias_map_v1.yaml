# P5 报表项目映射 v1。v0 保持不可变；本版对齐统一抽取载荷并启用显式符号转换。
version: v1
generated: 2026-09-06
supersedes: config/statements/item_alias_map_v0.yaml
extends_report_items: docs/knowledge-base/02_research/synthesis/指标库初始数据集_v0_草案.yaml

new_items:
  is.gross_profit: {cas: 毛利（营业收入−营业成本，A股不单列）, ifrs: gross profit}
  is.attr_net_profit: {cas: 归属于母公司所有者的净利润, ifrs: profit attributable to owners of the Company}
  bs.attr_equity: {cas: 归属于母公司所有者权益合计, ifrs: equity attributable to owners of the Company}
  bs.noncurrent_liab: {cas: 非流动负债合计, ifrs: total non-current liabilities (IAS 1)}
  is.rnd_exp: {cas: 研发费用, ifrs: research and development expenses}
  is.total_op_cost: {cas: 营业总成本（CAS 特有行项目）, ifrs: n/a}
  is.interest_income: {cas: 利息收入, ifrs: interest income (IFRS 9)}
  is.other_income: {cas: 其他收益（CAS 单列；IFS 其他收入净额）, ifrs: other income/gains (losses), net}
  is.investment_income: {cas: 投资收益（CAS）/ 投资收益净额及其他（IFRS）, ifrs: investment income/(loss), net and others}
  is.share_of_associates: {cas: 对联营企业和合营企业的投资收益, ifrs: share of profits/(losses) of associates and JVs}
  cf.icf: {cas: 投资活动产生的现金流量净额, ifrs: net cash from investing activities (IAS 7)}
  cf.fin_cf: {cas: 筹资活动产生的现金流量净额, ifrs: net cash from financing activities (IAS 7)}
  mpm.non_ifrs_operating_profit: {cas: n/a, ifrs: non-IFRS operating profit（MPM，须有调节表）, mpm: true}
  mpm.non_ifrs_attr_profit: {cas: n/a, ifrs: non-IFRS profit attributable to owners（MPM，须有调节表）, mpm: true}

companies:
  sf_002352:
    statements:
      合并资产负债表:
        roles: {期末余额: end, 期初余额: open}
        map:
          货币资金: bs.cash
          应收票据: bs.notes_receivable
          应收账款: bs.ar
          存货: bs.inventory
          流动资产合计: bs.current_assets
          固定资产: bs.fixed_assets
          资产总计: bs.total_assets
          应付账款: bs.ap
          流动负债合计: bs.current_liab
          非流动负债合计: bs.noncurrent_liab
          负债合计: bs.total_liab
          所有者权益合计: bs.equity
          归属于母公司所有者权益合计: bs.attr_equity
          _bs.short_debt: {sum: [短期借款, 一年内到期的非流动负债]}
          _bs.long_debt: {sum: [长期借款, 应付债券, 租赁负债], note: 含租赁负债（IFRS16 口径影响待评审）}
      合并利润表:
        roles: {本期发生额: cur, 上期发生额: prev_yoy}
        map:
          一、营业总收入: is.revenue
          其中：营业成本: is.cogs
          税金及附加: is.taxes_surcharges
          销售费用: is.selling_exp
          管理费用: is.admin_exp
          研发费用: is.rnd_exp
          财务费用: is.fin_exp
          其中：利息费用: is.interest_exp
          二、营业总成本: is.total_op_cost
          三、营业利润（亏损以“－”号填列）: is.operating_profit
          四、利润总额（亏损总额以“－”号填列）: is.total_profit
          减：所得税费用: is.income_tax
          五、净利润（净亏损以“－”号填列）: is.net_profit
          1.归属于母公司所有者的净利润: is.attr_net_profit
      合并现金流量表:
        roles: {本期发生额: cur, 上期发生额: prev_yoy}
        map:
          销售商品、提供劳务收到的现金: cf.cash_from_sales
          经营活动产生的现金流量净额: cf.ocf
          投资活动产生的现金流量净额: cf.icf
          筹资活动产生的现金流量净额: cf.fin_cf
          购建固定资产、无形资产和其他长期资产支付的现金: cf.capex

  tencent_0700:
    statements:
      合并利润表:
        roles: {本期发生额: cur, 上期发生额: prev_yoy}
        map:
          收入: is.revenue
          收入成本: {item: is.cogs, abs: true}
          毛利: is.gross_profit
          销售及市场推广开支: {item: is.selling_exp, abs: true}
          一般及行政开支: {item: is.admin_exp, abs: true, note: IFRS 一般及行政开支含研发投入，与 CAS 管理费用口径不同（§10.2 口径差异）}
          财务成本: {item: is.fin_exp, abs: true}
          利息收入: is.interest_income
          其他收益/（亏损）净额: is.other_income
          投资收益/（亏损）净额及其他: is.investment_income
          分占联营公司及合营公司盈利/（亏损）净额: is.share_of_associates
          经营盈利: is.operating_profit
          除税前盈利: is.total_profit
          所得税开支: {item: is.income_tax, abs: true}
          期内盈利: is.net_profit
          本公司权益持有人: is.attr_net_profit
          非国际财务报告准则经营盈利: mpm.non_ifrs_operating_profit
          本公司权益持有人应占盈利: mpm.non_ifrs_attr_profit

  jd_logistics_2618:
    statements:
      业绩摘要:
        roles: {value: cur}
        map:
          revenue: is.revenue
          gross: is.gross_profit
          profit: is.net_profit
          attr_np: is.attr_net_profit
          non_ifrs_attr: mpm.non_ifrs_attr_profit
